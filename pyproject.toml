[project]
name = "hdfs-mcp-server"
version = "0.1.0"
description = "MCP Server for Cloudera Agent Studio supporting HDFS, S3a, ADLS, and Ozone via RAZ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Pin to the 1.x line: mcp 2.0.0 removed the bundled `mcp.server.fastmcp`
    # module this server imports. Upgrade only after migrating to the 2.x API.
    "mcp[cli]>=1.2.0,<2",
    "pyarrow>=14.0.0",
    # Business-document extraction for the stream_file tool. Extras pull the
    # per-format parsers (pdfminer.six, python-docx, python-pptx, openpyxl).
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.0",
    "pdfminer.six>=20221105",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package lives under src/; hatchling ships all files inside it (including
# the bundled CA PEMs under cacerts/) in the wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/hdfs_mcp_server"]

[project.scripts]
hdfs-mcp-server = "hdfs_mcp_server.server:main"